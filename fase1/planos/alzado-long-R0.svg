<svg xmlns="http://www.w3.org/2000/svg" width="840" height="480" viewBox="0 0 840 480" font-family="Consolas, monospace">
  <rect width="840" height="480" fill="#fdfaf4"/>
  <text x="420" y="30" text-anchor="middle" font-size="17" fill="#7a2e1d">MiniHouse · ALZADO LONGITUDINAL (fachada y=3000) R0 — CONCEPTUAL — NOT FOR FABRICATION</text>
  <text x="420" y="50" text-anchor="middle" font-size="11" fill="#555">2026-11-16 · mm · z=0 cara superior del chasis · S-01 H=3200 · S-02 libre 2400 · S-03 techo ≈3,8°</text>

  <!-- scale 0.1 px/mm; ground z=0 at py=400; x offset 120 -->
  <!-- wall top z=3000 -> py=100 ; roof ridge z=3200 at y=0 side, this facade is low side z≈2938? keep simple: monopendiente across y, so longitudinal facade constant height 3000 -->
  <g stroke="#333" fill="none" stroke-width="2">
    <rect x="120" y="100" width="600" height="300"/>
    <line x1="120" y1="400" x2="720" y2="400" stroke-width="4"/>
  </g>
  <text x="420" y="418" text-anchor="middle" font-size="10" fill="#8a6d3b">chasis (sección SIN DEFINIR) — z=0</text>

  <!-- interior clear height 2400 -> py=160 -->
  <line x1="120" y1="160" x2="720" y2="160" stroke="#999" stroke-dasharray="6 4"/>
  <text x="728" y="164" font-size="10" fill="#777">libre 2400 (S-02)</text>

  <!-- P-01 door: center x4500 w900 h2050 => px 525..615, py 400-205=195 -->
  <rect x="525" y="195" width="90" height="205" fill="#dfe9f3" stroke="#1d6fa5" stroke-width="2"/>
  <text x="570" y="185" text-anchor="middle" font-size="10" fill="#1d6fa5">P-01 900×2050</text>
  <!-- V-01: center 2400 w1200 sill 900 h1100 => px 300..420, py 400-90-110=200..310 -->
  <rect x="300" y="200" width="120" height="110" fill="#dfe9f3" stroke="#1d6fa5" stroke-width="2"/>
  <text x="360" y="192" text-anchor="middle" font-size="10" fill="#1d6fa5">V-01 1200×1100</text>
  <text x="360" y="330" text-anchor="middle" font-size="9" fill="#1d6fa5">antepecho 900</text>

  <!-- lifting candidates high z=3000 corners -->
  <g fill="none" stroke="#a33" stroke-width="2">
    <circle cx="120" cy="100" r="9"/><circle cx="720" cy="100" r="9"/>
    <rect x="112" y="392" width="16" height="16"/><rect x="712" y="392" width="16" height="16"/>
  </g>
  <text x="742" y="104" font-size="10" fill="#a33">○ alto z≈3000</text>
  <text x="742" y="404" font-size="10" fill="#a33">□ bajo z≈0</text>

  <!-- dims -->
  <g stroke="#333" stroke-width="1" fill="#333" font-size="11">
    <line x1="120" y1="445" x2="720" y2="445"/>
    <line x1="120" y1="439" x2="120" y2="451"/><line x1="720" y1="439" x2="720" y2="451"/>
    <text x="420" y="462" text-anchor="middle">6000</text>
    <line x1="80" y1="80" x2="80" y2="400"/>
    <line x1="74" y1="80" x2="86" y2="80"/><line x1="74" y1="400" x2="86" y2="400"/>
    <text x="66" y="240" text-anchor="middle" transform="rotate(-90 66 240)">3200 total (S-01, incluye techo)</text>
    <line x1="770" y1="100" x2="770" y2="400"/>
    <line x1="764" y1="100" x2="776" y2="100"/><line x1="764" y1="400" x2="776" y2="400"/>
    <text x="788" y="250" text-anchor="middle" font-size="10" transform="rotate(-90 788 250)">3000 pared (borde bajo techo)</text>
  </g>
  <!-- roof line hint: top of wall 100, ridge +200mm at other facade -> note only -->
  <line x1="120" y1="100" x2="720" y2="80" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="10 5"/>
  <text x="420" y="74" text-anchor="middle" font-size="10" fill="#8a6d3b">cumbrera al otro lado (y=0), +200 ≈ 3,8° (S-03) — proyección</text>
</svg>