<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniHouse · Retning A, Patina (Style Tile)</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../../../../../../web/promo/src/styles/tokens.css">
  <style>
    body {
      margin: 0;
      padding: var(--space-5) var(--space-4);
      background: color-mix(in srgb, var(--solvgra) 30%, var(--kalk));
      color: var(--tjaere);
      font: 400 var(--size-small) / var(--leading-text) "Segoe UI", system-ui, sans-serif;
    }
    .header-bar {
      max-width: 1680px;
      margin: 0 auto var(--space-5);
      background: var(--kalk);
      padding: var(--space-4);
      border: 1px solid var(--solvgra);
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-bar h1 {
      font-family: var(--font-display);
      font-size: var(--size-h3);
      font-weight: 800;
      margin: 0 0 4px;
      color: var(--tjaere);
    }
    .header-bar p { margin: 0; color: var(--malmfuru-mork); font-size: var(--size-caption); }
    .badge {
      background: var(--action);
      color: var(--kalk);
      padding: 6px 12px;
      border-radius: var(--radius);
      font-weight: 500;
      font-size: var(--size-caption);
    }
    .frames {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: var(--space-5);
      justify-content: center;
      max-width: 1720px;
      margin: 0 auto;
    }
    .frame p { margin: 0 0 var(--space-2); font-weight: 600; font-size: var(--size-caption); }
    iframe { display: block; border: 1px solid var(--solvgra); background: var(--kalk); }
  </style>
</head>
<body>
  <div class="header-bar">
    <div>
      <h1>Retning A · Patina (Anbefalt)</h1>
      <p>Kalkbunn, tjæresort tekst, kobber på knapper/lenker, Besley + Jost. Responsive visninger testet i ekte 360 px og 1280 px viewports.</p>
    </div>
    <div class="badge">DESIGN-GUIDE §3 Tokens</div>
  </div>
  <div class="frames">
    <div class="frame">
      <p>Mobilvisning (360 px)</p>
      <iframe src="tile-a.html" width="360" height="2300" title="Retning A mobilvisning"></iframe>
    </div>
    <div class="frame">
      <p>Desktopvisning (1280 px)</p>
      <iframe src="tile-a.html" width="1280" height="1650" title="Retning A desktopvisning"></iframe>
    </div>
  </div>
</body>
</html>
